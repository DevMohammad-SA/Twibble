repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      # Run the linter
      - id: ruff
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format

  - repo: local
    hooks:
      - id: django-tests
        name: django-tests
        entry: ./venv/bin/python manage.py test
        language: system
        pass_filenames: false
        always_run: true
