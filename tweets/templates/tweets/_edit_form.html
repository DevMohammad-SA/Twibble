<div class="card mb-3" id="tweet-{{ tweet.id }}">
  <div class="card-body">
    <form hx-post="{% url 'tweets:edit' tweet.id %}" hx-target="#tweet-{{ tweet.id }}" hx-swap="outerHTML">
      {% csrf_token %}

      <div class="mb-3">
        <textarea name="text" class="form-control" rows="3" maxlength="300" autofocus>{{ tweet.text }}</textarea>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" hx-get="{% url 'tweets:edit' tweet.id %}"
          hx-target="#tweet-{{ tweet.id }}" hx-swap="outerHTML" onclick="location.reload()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary btn-sm">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
