<a href="#" hx-post="{% url 'tweets:bookmark_toggle' tweet.pk %}" hx-swap="outerHTML" class="text-decoration-none text-muted d-flex align-items-center">
  {% if request.user in tweet.bookmarks.all %}
  <i class="bi bi-bookmark-fill text-primary me-2"></i>
  {% else %}
  <i class="bi bi-bookmark me-2"></i>
  {% endif %}
</a>
