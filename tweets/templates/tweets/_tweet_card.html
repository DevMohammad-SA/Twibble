<div class="p-3 border-bottom">
    <div class="d-flex">
        <a href="{% url 'users:profile' tweet.user.username %}" class="flex-shrink-0">
            <img src="{{ tweet.user.profile_image.url }}" 
                 alt="{{ tweet.user.username }}" 
                 class="rounded-circle object-fit-cover"
                 width="48" height="48">
        </a>

        <div class="ms-3 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <div>
                    <a href="{% url 'users:profile' tweet.user.username %}" class="fw-bold text-body-emphasis text-decoration-none me-1">
                        {{ tweet.user.username }}
                    </a>
                    <small class="text-muted">{{ tweet.created_at|date:"Y-m-d" }}</small>
                </div>
                {% include 'users/_follow_button.html' with current_user=request.user profile_user=tweet.user %}
                <!-- Delete button -->
                {% if tweet.user == request.user %}
                <form action="{% url 'tweets:delete' tweet.id %}" method="POST" onsubmit="return confirm('Are you sure you want to delete this tweet?');">
                  {%csrf_token%}
                  <button
                    type='submit'
                    class='btn btn-outline-danger btn-sm'
                    title="Delete tweet">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
                {% endif %}
            </div>
            
            <p class="mb-2 text-break fs-6">{{ tweet.text }}</p>
            
            <div class="d-flex justify-content-between text-muted" style="max-width: 300px;">
                <a href="#" class="text-decoration-none text-muted d-flex align-items-center">
                    <i class="bi bi-chat me-2"></i> <span class="small">Comment</span>
                {%include "tweets/_like_button.html"%}
                <a href="#" class="text-decoration-none text-muted d-flex align-items-center">
                    <i class="bi bi-share me-2"></i> <span class="small">Share</span>
                </a>
            </div>
        </div>
    </div>
</div>
