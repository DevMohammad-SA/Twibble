<div class="card mb-3 shadow-sm">
    <div class="card-body d-flex">
        <!-- Profile Image -->
        <img src="{{ tweet.user.profile_image.url }}" 
            alt="{{ tweet.user.username }}'s profile picture" 
            class="rounded-circle me-3"
            style="width:50px; height:50px; object-fit:cover;">

        <!-- Tweet content -->
        <div class="flex-grow-1 d-flex align-items-start justify-content-center">
          <div>
            <a href="{% url 'users:profile' tweet.user.username %}" 
              class="text-decoration-none fw-bold text-dark">
                {{ tweet.user.username }}
            </a>
            <p class="mb-1">{{ tweet.text }}</p>
            <a class="text-muted bi bi-chat me-3 text-decoration-none" href="#"> Comment</a>
            <a class="text-muted bi bi-heart me-3 text-decoration-none" href="#"> Like</a>
            <a class="text-muted bi bi-share me-3 text-decoration-none" href="#"> Share</a>
            <small class="text-muted ms-auto">{{ tweet.created_at|date:"M d, Y H:i" }}</small>
          </div>
          <!-- Follow button far right -->
          <div class="me-auto">
          {% include 'users/_follow_button.html' with current_user=request.user profile_user=tweet.user %}
          </div>
        </div>
    </div>
</div>
