{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password Reset Complete" %}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-check-circle-fill display-1 textfsuccess"></i>
    <h3 class="fw-bold mt-3">{% trans "Password changed!" %}</h3>
    <p class="text-muted">{% trans "Your password has been set. You may go ahead and log in now." %}</p>
    <a href="{% url 'users:login' %}" class="btn btn-primary rounded-pill fw-bold px-4">{% trans "Log in" %}</a>
  </div>
</div>
{% endblock %}
