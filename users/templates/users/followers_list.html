{% extends "base.html" %}
{%block title%}Followers{%endblock%}
{% block content %}
<div class="container mt-4">
  {%for follower in followers%} 
    <div class="card mb-3">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="{{follower.profile_image}}" class="img-fluid rounded-start" alt="...">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <a href={%url 'users:profile' follower.username %}><h5 class="card-title">{{follower.username}}</h5></a>
          <p class="card-text">{{follower.bio}}</p>
          <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
        </div>
      </div>
    </div>
  </div>
    {%empty%}
    <p>no followers yet.</p>
  {%endfor%}
</div>

{%endblock%}
