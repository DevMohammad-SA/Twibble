{# users/templates/users/_follow_button.html #}
{% if profile_user != current_user %}
    {% if profile_user in current_user.following.all %}
        <form hx-post="{% url 'users:unfollow' profile_user.username %}" hx-swap="outerHTML">
            <button class="btn btn-sm btn-outline-secondary" type="submit">Unfollow</button>
        </form>
    {% else %}
        <form hx-post="{% url 'users:follow' profile_user.username %}" hx-swap="outerHTML">
            <button class="btn btn-sm btn-outline-primary" type="submit">Follow</button>
        </form>
    {% endif %}
{% endif %}
