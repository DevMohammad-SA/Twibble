{%extends "base.html"%}
{%block title%}Register{%endblock%}
{%block content%}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">Join Twibble</h2>
            <form method="post">
                {% csrf_token %}
                 {%if form.errors%}
                 <div class="text-danger small mt-1"> {{ form.errors | striptags }}</div>
                {%endif%}
                {%for field in form%}
                <div class="mb-3">
                  <label for="{{field.id_for_label}}" class="form-label">{{ field.label }}</label><br>
                {{ field }}
               </div>
                {%endfor%}

                <button type="submit" class="btn btn-primary">Submit</button>
                            <p class="mt-3 text-center">
                already an account ? <a href="{% url 'users:login' %}">Login</a>
            </p>
            </form>
{%endblock%}
