{% extends 'base.html' %}
{% load i18n %}
{% load django_bootstrap5 %}

{% block title %}{% trans "Set New Password" %}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6">
    <div class="card shadow-sm rounded-4 border-0">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-3">{% trans "Set a new password" %}</h3>
        <form method="post">
          {% csrf_token %}
          {% bootstrap_form form %}
          <button type="submit" class="btn btn-primary rounded-pill fw-bold w-100 mt-3">{% trans "Change Password" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
