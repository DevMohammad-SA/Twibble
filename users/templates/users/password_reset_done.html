{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Email Sent" %}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-envelope-check display-1 text-primary"></i>
    <h3 class="fw-bold mt-3">Check your inbox</h3>
    <p class="text-muted">{% trans "We've emailed you instructions for setting your password." %}</p>
    <a href="{% url 'users:login' %}" class="btn btn-outline-primary rounded-pill fw-bold">{% trans "Return to Login" %}</a>
  </div>
</div>
{% endblock %}
