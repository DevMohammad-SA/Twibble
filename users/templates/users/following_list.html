{% extends "base.html" %}

{%block title%} Followings {%endblock%}
{%block content %}
<div class="container mt-4">
  {%for following in followings%}
    <div class="card mb-3">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="{{following.profile_image}}" class="img-fluid rounded-start" alt="...">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <a class="text-body" href={%url 'users:profile' following.username %}><h5 class="card-title">{{following.username}}</h5></a>
          <p class="card-text">{{following.bio}}</p>
          <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
        </div>
      </div>
    </div>
  </div>
    {%empty%}
    <p>no followings yet.</p>
  {%endfor%}
</div>
{%endblock%}
